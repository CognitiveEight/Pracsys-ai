# Local commit gates. Install once per clone:
#   pip install -r requirements-dev.txt && pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  # Secret scanning: blocks service-account JSON, API keys and tokens before
  # they reach a commit (the credentials incident of 2026-10-13).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: ^pracsys2\.0/

  # Lint rules come from [tool.ruff] in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
