version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: simplertoday-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - simplertoday-network

  redis:
    image: redis:7-alpine
    container_name: simplertoday-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - simplertoday-network

  # Legal knowledge graph (ontology agentic RAG). Started only with
  # `docker-compose --profile graph up -d`. The password comes from .env
  # (NEO4J_PASSWORD) — never hard-code it; Neo4j refuses to start without one.
  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    container_name: simplertoday-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-}
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - simplertoday-network

volumes:
  qdrant_storage:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local

networks:
  simplertoday-network:
    driver: bridge

